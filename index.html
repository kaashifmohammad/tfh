<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steer the Ship</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Outfit:wght@400;600&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: 'Outfit', sans-serif;
    }

    /* Screen 1: Steering Into the Storm Scene */
    .scene-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: url("Steering Into the Stormy Sunset.png") no-repeat center center / cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding-bottom: clamp(35px, 7vh, 70px);
      transition: opacity 0.85s cubic-bezier(0.4, 0, 0.2, 1), transform 0.85s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 10;
    }

    .top-title-banner {
      position: relative;
      z-index: 15;
      text-align: center;
      margin-top: clamp(24px, 5vh, 48px);
      pointer-events: none;
    }

    .top-title-banner h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.8rem, 4.2vw, 3.4rem);
      font-weight: 900;
      letter-spacing: clamp(4px, 1vw, 8px);
      text-transform: uppercase;
      background: linear-gradient(180deg, #fff7db 0%, #f5c542 50%, #ad761a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 18px rgba(0, 0, 0, 0.95));
      line-height: 1.15;
    }

    .scene-container.fade-out {
      opacity: 0;
      transform: scale(1.08);
      pointer-events: none;
    }

    /* Subtle storm lighting vignette */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.05) 0%, rgba(0, 0, 0, 0.55) 100%);
      pointer-events: none;
    }

    /* Lightning flash effect */
    .lightning-flash {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0);
      pointer-events: none;
      transition: background 0.06s ease;
      z-index: 12;
    }

    /* Steer the Wheel Button */
    .steer-btn-wrapper {
      position: relative;
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .steer-wheel-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 46px;
      background: linear-gradient(180deg, rgba(38, 24, 13, 0.85) 0%, rgba(18, 10, 5, 0.95) 100%);
      border: 2px solid #e0aa3e;
      border-radius: 999px;
      color: #ffdf78;
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.1rem, 2.2vw, 1.5rem);
      font-weight: 900;
      letter-spacing: 3px;
      cursor: pointer;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.85), 0 0 30px rgba(224, 170, 62, 0.4), inset 0 1px 3px rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(12px);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      outline: none;
    }

    .steer-wheel-btn:hover {
      transform: translateY(-3px) scale(1.05);
      background: linear-gradient(180deg, rgba(55, 34, 18, 0.9) 0%, rgba(28, 15, 7, 0.98) 100%);
      border-color: #ffd466;
      color: #fff0a8;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.9), 0 0 45px rgba(245, 197, 66, 0.7), inset 0 2px 6px rgba(255, 255, 255, 0.7);
    }

    .steer-wheel-btn:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
    }

    .wheel-icon {
      width: 32px;
      height: 32px;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .steer-wheel-btn:hover .wheel-icon {
      transform: rotate(90deg);
    }

    /* Screen 2: Fullscreen Cinematic Video */
    .video-viewport {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.85s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 5;
    }

    .video-viewport.active {
      opacity: 1;
      pointer-events: auto;
    }

    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      outline: none;
    }

    /* Subtle Return Button (appears on mouse hover during video) */
    .return-btn {
      position: absolute;
      top: 24px;
      left: 24px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.7);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease, background 0.2s ease, transform 0.2s ease;
      z-index: 30;
      backdrop-filter: blur(8px);
    }

    .video-viewport:hover .return-btn {
      opacity: 0.85;
    }

    .return-btn:hover {
      opacity: 1 !important;
      background: rgba(0, 0, 0, 0.8);
      color: #f5c542;
      border-color: #f5c542;
      transform: scale(1.1);
    }

    /* Spin Transition Animation on Wheel Icon */
    .spinning {
      animation: spinFast 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes spinFast {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(720deg);
      }
    }
  </style>
</head>

<body>

  <!-- Screen 1: Steering Scene with blended button -->
  <div class="scene-container" id="sceneContainer">
    <div class="vignette"></div>
    <div class="lightning-flash" id="lightningFlash"></div>

    <!-- Top Title Banner -->
    <header class="top-title-banner">
      <h1>The Final Horizon</h1>
    </header>

    <div class="steer-btn-wrapper">
      <button class="steer-wheel-btn" id="steerBtn">
        <svg class="wheel-icon" id="wheelIcon" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 2.06c3.27.44 5.92 2.87 6.64 6.04L16.2 11c-.48-1.57-1.74-2.81-3.2-3.32V4.06zm-2 0V7.68c-1.46.51-2.72 1.75-3.2 3.32L4.36 10.1c.72-3.17 3.37-5.6 6.64-6.04zm-7.94 8c.04.66.16 1.3.36 1.9l3.52-1.02c.04-.61.16-1.2.36-1.76L3.06 12.06zm13.14 0c.2.56.32 1.15.36 1.76l3.52 1.02c.2-.6.32-1.24.36-1.9l-4.24-.88zm-3.2 2.32c-.51 1.46-1.75 2.72-3.32 3.2v3.62c3.27-.44 5.92-2.87 6.64-6.04l-3.32-.78zm-5.68 0l-3.32.78c.72 3.17 3.37 5.6 6.64 6.04v-3.62c-1.57-.48-2.81-1.74-3.32-3.2zM12 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4z" />
        </svg>
        STEER THE SHIP
      </button>
    </div>
  </div>

  <!-- Screen 2: Entire Screen Video Player -->
  <div class="video-viewport" id="videoViewport">
    <!-- Subtle return button in top corner -->
    <button class="return-btn" id="returnBtn" title="Steer Again">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
    </button>

    <video id="fullscreenVideo" playsinline preload="auto">
      Your browser does not support full screen video.
    </video>
  </div>

  <script>
    /* =========================================================
       7 Videos Probabilities:
       - SA_MetBat-ezremove.mp4: 20%
       - SA_UncharteddGame-ezremove.mp4: 20%
       - WhatsApp Video 2026-10-12 at 12.13.27 AM (1).mp4: 8%
       - Other 4 WhatsApp videos: 13% each (52% total)
       Total = 100%
       ========================================================= */
    const VIDEOS = [
      { file: "SA_MetBat-ezremove.mp4", prob: 20 },
      { file: "SA_UncharteddGame-ezremove.mp4", prob: 20 },
      { file: "WhatsApp Video 2026-10-12 at 12.13.26 AM.mp4", prob: 13 },
      { file: "WhatsApp Video 2026-10-12 at 12.13.26 AM (1).mp4", prob: 13 },
      { file: "WhatsApp Video 2026-10-12 at 12.13.27 AM.mp4", prob: 13 },
      { file: "WhatsApp Video 2026-10-12 at 12.13.27 AM (1).mp4", prob: 8 },
      { file: "WhatsApp Video 2026-10-12 at 12.13.28 AM.mp4", prob: 13 }
    ];

    const sceneContainer = document.getElementById('sceneContainer');
    const steerBtn = document.getElementById('steerBtn');
    const wheelIcon = document.getElementById('wheelIcon');
    const videoViewport = document.getElementById('videoViewport');
    const fullscreenVideo = document.getElementById('fullscreenVideo');
    const returnBtn = document.getElementById('returnBtn');
    const lightningFlash = document.getElementById('lightningFlash');

    let isSteering = false;

    // Pick video strictly based on the configured weighted probabilities
    function pickVideoByProbability() {
      const rand = Math.random() * 100;
      let cumulative = 0;
      for (let i = 0; i < VIDEOS.length; i++) {
        cumulative += VIDEOS[i].prob;
        if (rand < cumulative) {
          return VIDEOS[i].file;
        }
      }
      return VIDEOS[0].file;
    }

    // Lightning Flash
    function triggerLightning() {
      lightningFlash.style.background = 'rgba(255, 255, 255, 0.85)';
      setTimeout(() => {
        lightningFlash.style.background = 'rgba(255, 255, 255, 0.2)';
        setTimeout(() => {
          lightningFlash.style.background = 'rgba(255, 255, 255, 0.9)';
          setTimeout(() => {
            lightningFlash.style.background = 'transparent';
          }, 80);
        }, 50);
      }, 70);
    }

    function onSteerClick() {
      if (isSteering) return;
      isSteering = true;

      // Spin the wheel icon fast
      wheelIcon.classList.add('spinning');
      steerBtn.disabled = true;

      // Lightning storm trigger
      triggerLightning();

      const chosenVideoFile = pickVideoByProbability();
      fullscreenVideo.src = chosenVideoFile;
      fullscreenVideo.load();

      // Smooth cinematic transition after short steer feedback
      setTimeout(() => {
        sceneContainer.classList.add('fade-out');

        setTimeout(() => {
          videoViewport.classList.add('active');
          fullscreenVideo.play().catch(err => {
            console.log("Auto play prevented:", err);
          });
        }, 400);

      }, 600);
    }

    function returnToSteering() {
      fullscreenVideo.pause();
      fullscreenVideo.currentTime = 0;

      videoViewport.classList.remove('active');
      setTimeout(() => {
        sceneContainer.classList.remove('fade-out');
        wheelIcon.classList.remove('spinning');
        steerBtn.disabled = false;
        isSteering = false;
      }, 400);
    }

    // Listeners
    steerBtn.addEventListener('click', onSteerClick);
    returnBtn.addEventListener('click', returnToSteering);

    // When video ends naturally, return to steering screen
    fullscreenVideo.addEventListener('ended', returnToSteering);

    // Press Escape or space to control
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !videoViewport.classList.contains('active')) {
        e.preventDefault();
        onSteerClick();
      } else if (e.code === 'Escape' && videoViewport.classList.contains('active')) {
        returnToSteering();
      }
    });
  </script>
</body>

</html>
